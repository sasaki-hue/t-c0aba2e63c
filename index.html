<title>GOD 設定配分・期待値ツール</title>
<style>
  :root{
    --gold:#B8860B; --head:#FAD7A0; --gcol:#FCEEC4; --rowb:#FBF4E6;
    --border:#B0A080; --text:#333; --sub:#7A4B00; --plus:#1F5FBF; --minus:#C0392B;
    --panel:#FFF7E8; --bg:#fff; --muted:#8A8A8A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Meiryo",system-ui,sans-serif;
    font-size:14px;line-height:1.6}
  .wrap{max-width:1040px;margin:0 auto;padding:0 14px 60px}
  h1{background:var(--gold);color:#fff;font-size:19px;margin:0 -14px 0;padding:16px 14px;text-align:center}
  .meta{background:var(--panel);border:1px solid var(--border);border-top:none;
    padding:7px;text-align:center;font-size:11.5px;color:var(--sub);margin:0 -14px 18px}
  h2{font-size:15px;color:var(--sub);border-left:5px solid var(--gold);
    padding-left:9px;margin:26px 0 10px}
  .card{border:1px solid var(--border);border-radius:4px;padding:14px;background:#fff}
  .tabs{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
  .tab{padding:6px 14px;border:1px solid var(--border);border-radius:3px;cursor:pointer;
    background:#fff;font-size:13px}
  .tab.on{background:var(--head);font-weight:bold;color:var(--sub)}
  textarea{width:100%;height:135px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
    border:1px solid var(--border);border-radius:3px;padding:8px;resize:vertical}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:11.5px;color:var(--sub)}
  input[type=number],select{padding:6px 8px;border:1px solid var(--border);border-radius:3px;
    font-size:14px;font-family:inherit}
  input[type=number]{width:130px}
  button{background:var(--gold);color:#fff;border:none;border-radius:3px;padding:9px 26px;
    font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.08)}
  button.sub{background:#fff;color:var(--sub);border:1px solid var(--border);
    font-weight:normal;padding:6px 14px;font-size:12.5px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{background:var(--head);color:#5A3A00;border:1px solid var(--border);padding:6px 5px;
    font-size:12px;white-space:nowrap}
  td{border:1px solid var(--border);padding:5px;text-align:center;white-space:nowrap}
  tbody tr:nth-child(even){background:var(--rowb)}
  td.lab{background:var(--gcol);font-weight:bold}
  .plus{color:var(--plus);font-weight:bold}
  .minus{color:var(--minus);font-weight:bold}
  .ref{color:var(--muted);font-size:12px}
  .scroll{overflow-x:auto}
  .kpi{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:12px}
  .kpi div{flex:1;min-width:150px;border:1px solid var(--border);border-radius:4px;
    padding:9px;text-align:center;background:var(--panel)}
  .kpi .v{font-size:21px;font-weight:bold;color:var(--sub);display:block;line-height:1.3}
  .kpi .k{font-size:11px;color:var(--sub)}
  .bar{height:24px;display:flex;border:1px solid var(--border);border-radius:3px;
    overflow:hidden;margin:10px 0 6px}
  .bar span{display:flex;align-items:center;justify-content:center;font-size:10.5px;
    color:#fff;text-shadow:0 0 3px rgba(0,0,0,.5);overflow:hidden;white-space:nowrap}
  .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;margin-bottom:8px}
  .leg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
  tr.zone td{background:#F3F0E9 !important;color:#9A938A}
  tr.zone td.lab{background:#EBE6DC !important;color:#9A938A}
  .zonetag{font-size:9px;color:#B0662A;display:block;line-height:1.1}
  .note{font-size:11.5px;color:var(--sub);background:var(--panel);
    border:1px solid var(--border);border-radius:3px;padding:9px;margin-top:11px}
  .confbox{border:1px solid var(--border);border-radius:4px;padding:11px 13px;margin-top:2px}
  .confhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .confbadge{display:inline-flex;align-items:center;gap:6px;font-weight:bold;font-size:14px;
    padding:4px 12px;border-radius:20px;color:#fff}
  .confgauge{flex:1;min-width:140px;height:12px;background:#EFE8D8;border:1px solid var(--border);
    border-radius:8px;overflow:hidden}
  .confgauge i{display:block;height:100%;border-radius:8px}
  .confmarks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);
    margin-top:2px;padding:0 1px}
  .conftext{font-size:12px;color:var(--text);margin-top:8px;line-height:1.7}
  .confrange{font-size:11.5px;color:var(--sub);margin-top:5px}
  .note b{color:var(--minus)}
  .warn{background:#FDF0E6;border-color:var(--minus);color:#8a3520}
  .hide{display:none}
  details{margin-top:11px;font-size:12.5px}
  summary{cursor:pointer;color:var(--sub);font-weight:bold}
  details .body{padding:9px 3px;color:#555;line-height:1.75}
  @media(max-width:640px){
    body{font-size:13px} h1{font-size:16px} .kpi .v{font-size:18px}

<div class="wrap">
<h1>Lミリオンゴッド-神々の軌跡-　設定配分・期待値ツール</h1>
<div class="meta" id="meta"></div>

<h2>1. ホールデータを入力</h2>
<div class="card">
  <div class="tabs">
    <div class="tab on" data-mode="rows">台ごとに貼り付け(推奨)</div>
    <div class="tab" data-mode="total">合計値を直接入力</div>
  </div>

  <div id="pane-rows">
    <textarea id="rows" placeholder="1行=1台(または1台×1日)。&#10;左から「総通常G」「初当り回数」。タブ/カンマ/スペース区切り、Excelからそのまま貼り付け可。&#10;台番号など余分な列があっても、数値2つ以上あれば後ろ2つ以外は無視されます。&#10;&#10;例:&#10;8123	17&#10;7640	13&#10;9012	21&#10;6885	12"></textarea>
    <div class="row">
      <button class="sub" id="sample">サンプルを入れる</button>
      <span class="ref" id="rowinfo"></span>
    </div>
  </div>

  <div id="pane-total" class="hide">
    <div class="row">
      <div class="fld"><label>総通常G(全台合計)</label>
        <input type="number" id="tN" value="120000" min="1" step="1000"></div>
      <div class="fld"><label>初当り回数(全台合計)</label>
        <input type="number" id="tK" value="250" min="1"></div>
    </div>
    <div class="note">合計値だけだと<b>初当り確率という1つの数字</b>しか使えません。設定配分を決めるのは
      台間の<b>ばらつき</b>なので、可能なら台ごとの行を貼り付けてください(推定精度が大きく変わります)。</div>
  </div>

  <div class="row" style="border-top:1px dashed var(--border);padding-top:12px;margin-top:14px">
    <div class="fld"><button id="run">計算する</button></div>
    <span class="ref" style="align-self:center">コイン持ちの前提: 奇数設定 30.8G / 偶数設定 34.0G(50枚あたり)/ 円表示は20円換算</span>
  </div>
</div>

<div id="out" class="hide">
  <h2>2. 初当り確率</h2>
  <div class="card">
    <div class="kpi" id="kpi1"></div>
    <div id="conf"></div>
    <div class="note" id="note1"></div>
  </div>

  <h2>3. 推定設定配分</h2>
  <div class="card">
    <div class="bar" id="bar"></div>
    <div class="leg" id="leg"></div>
    <div class="scroll"><table id="tSettei"></table></div>
    <div class="kpi" id="kpi2" style="margin-top:12px"></div>
    <div class="note" id="note2"></div>
  </div>

  <h2>4. 着席G別 期待値表</h2>
  <div class="card">
    <div class="scroll"><table id="tEV"></table></div>
    <div class="note" id="note3"></div>
  </div>

  <h2>5. 有限窓評価(ゾーン拾い: 着席X→終了Gまで回してヤメ)</h2>
  <div class="card">
    <div class="row" style="margin-top:0">
      <div class="fld"><label>着席G(X)</label>
        <input type="number" id="wX" value="32" min="0" max="1450" step="1"></div>
      <div class="fld"><label>終了G(ここまで回してヤメ)</label>
        <input type="number" id="wEnd" value="37" min="1" max="1499" step="1"></div>
      <div class="fld"><label>&nbsp;</label><button class="sub" id="wRun">窓を評価</button></div>
    </div>
    <div class="kpi" id="kpiW" style="margin-top:12px"></div>
    <div class="scroll"><table id="tW"></table></div>
    <div class="note" id="noteW"></div>
  </div>

  <details>
    <summary>計算の中身(クリックで展開)</summary>
    <div class="body" id="method"></div>
  </details>
</div>

function parseRows() {
  const txt = document.getElementById('rows').value;
  const rows = [];
  for (const line of txt.split('\n')) {
    const nums = (line.match(/-?\d+(\.\d+)?/g) || []).map(Number);
    if (nums.length < 2) continue;
    const n = nums[nums.length - 2], k = nums[nums.length - 1];
    if (n > 0 && k >= 0 && n >= k) rows.push({ n, k });

  const N = rows.reduce((a, r) => a + r.n, 0), K = rows.reduce((a, r) => a + r.k, 0);

/* ---------- 最大エントロピー傾斜 ---------- */
// v_s ∝ prior_s * exp(t1*x_s + t2*x_s^2),  x_s = λ_s/λref - 1
const LAMREF = S.lam.reduce((a, l, i) => a + l * D.prior[i], 0);
const X = S.lam.map(l => l / LAMREF - 1);

function tilt(t1, t2) {
  const w = D.prior.map((p, i) => p * Math.exp(t1 * X[i] + t2 * X[i] * X[i]));
  const z = w.reduce((a, b) => a + b, 0);
  return w.map(x => x / z);
}
const mOf = w => w.reduce((a, x, i) => a + x * S.lam[i], 0);
const cvOf = w => {
  const m = mOf(w);
  const v = w.reduce((a, x, i) => a + x * (S.lam[i] - m) ** 2, 0);
  return Math.sqrt(v) / m;
};

function solveMean(target, t2) {            // t1 を二分法(平均は t1 に単調)
  let lo = -400, hi = 400;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (mOf(tilt(mid, t2)) < target) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function estimate(targetMean, targetCV) {
  // 平均だけ合わせる解
  let t1 = solveMean(targetMean, 0), best = tilt(t1, 0), usedCV = null;
  if (targetCV != null && isFinite(targetCV)) {
    // t2 をグリッド探索(内側で t1 を再解)して CV を合わせる
    let bd = Infinity, bw = best, bt2 = 0;
    for (let t2 = -60; t2 <= 60; t2 += 0.25) {
      const a = solveMean(targetMean, t2), w = tilt(a, t2);
      const d = Math.abs(cvOf(w) - targetCV);
      if (d < bd) { bd = d; bw = w; bt2 = t2; }
    }
    if (bd < 0.02) { best = bw; usedCV = cvOf(bw); }
  }
  return { w: best, cv: usedCV };
}

/* ---------- 設定別の生存曲線と TY ---------- */
function buildCurves(baseKey, shortfall) {
  const ltPub = baseKey === 'guki' ? S.lt_guki : S.lt_base;
  const ltMkt = ltPub.map(x => x * (1 + shortfall));
  const tS = ltMkt.map((x, i) => x / S.lam[i]);           // 設定別 1初当りTY
  const tRef = ltMkt.reduce((a, x, i) => a + D.prior[i] * x, 0)
             / S.lam.reduce((a, l, i) => a + D.prior[i] * l, 0);
  const cS = S.is_even.map(e => 50 / (baseKey === 'guki' && e
              ? SP.coin_mochi_even : SP.coin_mochi_odd));
  const out = [];
  for (let s = 0; s < NS; s++) {
    const phi = S.lam[s] / LAMREF;                        // ハザード倍率
    const St = new Float64Array(GMAX + 1), cum = new Float64Array(GMAX + 1);
    let p = 1, c = 0;
    for (let g = 0; g <= GMAX; g++) {
      p *= (1 - Math.min(0.999, phi * D.hazard[g]));
      St[g] = p; c += p; cum[g] = c;
    }
    out.push({ St, cum, cumMax: c, psi: tS[s] / tRef, c: cS[s], ltMkt: ltMkt[s], t: tS[s] });
  }
  return out;
}

/* ---------- 着席G の評価(設定混合)---------- */
function evalSeat(cur, w, Xg) {
  let den = 0;
  const post = [];
  for (let s = 0; s < NS; s++) { const q = w[s] * cur[s].St[Xg]; post.push(q); den += q; }
  if (den <= 0) return null;
  for (let s = 0; s < NS; s++) post[s] /= den;

  let eNet = 0, eIn = 0, eAdd = 0, eTy = 0;
  for (let s = 0; s < NS; s++) {
    if (post[s] <= 0) continue;
    const cu = cur[s];
    const add = (cu.cumMax - cu.cum[Xg]) / cu.St[Xg];      // 追加通常G
    const ty = D.ty[Xg] * cu.psi + SP.max_bet_corr;        // RUSH_TY(MAXBET補正後)
    const ng = add + SP.yame_hosei_g, ag = ty / SP.at_net_gain;
    eNet += post[s] * (ty - cu.c * ng);
    eIn += post[s] * SP.bet * (ng + ag);
    eAdd += post[s] * add;
    eTy += post[s] * ty;
  }
  return { post, add: eAdd, ty: eTy, ev: eNet, roi: eIn > 0 ? 1 + eNet / eIn : NaN, in: eIn };
}

/* ---------- 有限窓評価(engine_core.window_eval と同式・設定混合)---------- */
function evalWindow(cur, w, Xg, Bg) {
  const end = Math.min(Xg + Bg, GMAX);
  if (end <= Xg) return null;
  const nWin = D.win_cnt_cum[end] - D.win_cnt_cum[Xg];
  const rawGain = nWin > 0
    ? (D.win_gain_cum[end] - D.win_gain_cum[Xg]) / nWin
    : D.ty[Xg];                                    // 窓内に実データが無ければ全体TYで代用
  let den = 0;
  const post = [];
  for (let s = 0; s < NS; s++) { const q = w[s] * cur[s].St[Xg]; post.push(q); den += q; }
  if (den <= 0) return null;
  let net = 0, tin = 0, pw = 0, eN = 0;
  for (let s = 0; s < NS; s++) {
    const p = post[s] / den;
    if (p <= 0) continue;
    const cu = cur[s], sx = cu.St[Xg];
    const pWin = 1 - cu.St[end] / sx;
    let e = 0;
    for (let t = Xg; t < end; t++) e += cu.St[t];
    e /= sx;                                       // 実際に回す通常G
    const gain = rawGain * cu.psi + SP.max_bet_corr;
    const atG = gain / SP.at_net_gain;
    net += p * (pWin * gain - cu.c * e);
    tin += p * (e + pWin * atG) * SP.bet;
    pw += p * pWin;
    eN += p * e;
  }
  return { pWin: pw, eN, gain: rawGain, net, roi: tin > 0 ? 1 + net / tin : NaN, nWin };
}

  const diff = (lamHall / MK.lam_obs - 1) * 100;
  document.getElementById('kpi1').innerHTML = [
    ['初当り確率', '1/' + (1 / lamHall).toFixed(1)],
    ['総通常G', N.toLocaleString() + ' G'],
    ['初当り回数', K.toLocaleString() + ' 回'],
    ['市場平均(1/' + (1 / MK.lam_obs).toFixed(1) + ')比',
      (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%'],
  ].map(([k, v]) => `<div><span class="v">${v}</span><span class="k">${k}</span></div>`).join('');
  /* --- 信頼度(初当り回数ベース。統計用語を使わず段階表示)--- */
  const relse = Math.sqrt(MK.cv2_within / K);      // 初当り確率の相対ブレ(更新過程近似)
  const d95 = 1.96 * relse;
  const rLo = 1 / (lamHall * (1 + d95)), rHi = 1 / (lamHall * (1 - d95));
  const TIERS = [
    { min: 0, mark: '×', name: '参考程度', col: '#C0392B',
      text: `コインを数回投げただけでは表裏の偏りが分からないのと同じで、初当り${K.toLocaleString()}回では`
        + `偶然のブレと設定の差をまだ区別できません。下の設定配分は<b>市場平均に近い「仮の値」</b>、`
        + `期待値表もその分だけ市場平均寄りの表示です。` },
    { min: 150, mark: '△', name: '傾向が見える', col: '#D97E1F',
      text: `大まかな傾向(設定1が中心か、偶数設定が混じっていそうか)は見えてきます。`
        + `ただし各設定の%は、同じ店でもデータを取り直すたびに数%単位で動く段階です。断定はまだ早めに。` },
    { min: 500, mark: '○', name: '大枠は信頼できる', col: '#6B8E23',
      text: `配分の大枠(設定1がどのくらい厚いか、設定4以上が何%あるか)は信頼できるデータ量です。`
        + `初当りの近い設定どうし(1と3など)の細かい区別は、この量でもまだできません。` },
    { min: 1500, mark: '◎', name: '十分', col: '#2E7D32',
      text: `設定推定として十分なデータ量です。それでも初当りの近い設定どうし(1と3など)は`
        + `原理的に区別できないため、「設定1中心か / 偶数が混じるか」という群の読み方は変わりません。` },
  ];
  const tier = TIERS.filter(t => K >= t.min).pop();
  const pct = Math.min(100, Math.sqrt(K / 2000) * 100);
  document.getElementById('conf').innerHTML = `
    <div class="confbox" style="border-left:5px solid ${tier.col}">
      <div class="confhead">
        <span class="confbadge" style="background:${tier.col}">${tier.mark} 信頼度: ${tier.name}</span>
        <div style="flex:1;min-width:140px">
          <div class="confgauge"><i style="width:${pct}%;background:${tier.col}"></i></div>
          <div class="confmarks"><span>0回</span><span>150回=傾向</span><span>500回=大枠</span><span>1500回=十分</span></div>
        </div>
      </div>
      <div class="conftext">${tier.text}</div>
      <div class="confrange">初当り確率のブレ幅(だいたいの範囲): <b>1/${rLo.toFixed(0)} 〜 1/${rHi.toFixed(0)}</b>
        — 同じ店でも、データを取り直すとこの範囲で変わり得ます。</div>
    </div>`;

  document.getElementById('note1').innerHTML =
    `市場平均より${diff >= 0 ? '<b>軽い</b>' : '重い'}(+は軽い=当たりやすい)。`
    + `公表定義との塊境界のズレを α=${MK.alpha} で補正し、公表基準では 1/${(1/lamPub).toFixed(1)} 相当として設定を推定します。`
    + (clamped ? ' <b>※初当りが設定1〜6の範囲外です。端に張り付かせて計算しています。</b>' : '');

  /* --- 3. 設定配分 --- */
  // バー内ラベルは幅に応じて省略(狭い区画は凡例で読む)
  document.getElementById('bar').innerHTML = w.map((x, i) => {
    const label = x >= 0.22 ? `${S.labels[i]} ${(x * 100).toFixed(0)}%`
      : x >= 0.10 ? `${(x * 100).toFixed(0)}%` : '';
    return `<span style="width:${(x * 100).toFixed(2)}%;background:${PAL[i]}">${label}</span>`;
  }).join('');
  document.getElementById('leg').innerHTML = w.map((x, i) =>
    `<span><i style="background:${PAL[i]}"></i>${S.labels[i]} ${(x * 100).toFixed(1)}%</span>`).join('');

  let h = '<thead><tr><th>設定</th><th>推定比率</th><th>公表 初当り</th>'
        + '<th>推定 出玉率</th><th>(参考)公表機械割</th></tr></thead><tbody>';
  for (let s = 0; s < NS; s++) {
    const cu = cur[s];
    const m = 1 + (cu.ltMkt - cu.c) / (3 + 3 * cu.ltMkt / SP.at_net_gain);
    h += `<tr><td class="lab">${S.labels[s]}</td>`
      + `<td><b>${(w[s] * 100).toFixed(1)}%</b></td>`
      + `<td class="ref">1/${S.lam_den[s]}</td>`
      + `<td class="${m >= 1 ? 'plus' : 'minus'}">${(m * 100).toFixed(1)}%</td>`
      + `<td class="ref">${(S.kohyo_m[s] * 100).toFixed(1)}%</td></tr>`;
  }
  h += '</tbody>';
  document.getElementById('tSettei').innerHTML = h;

  const mAvg = w.reduce((a, x, s) => {
    const cu = cur[s];
    return a + x * (1 + (cu.ltMkt - cu.c) / (3 + 3 * cu.ltMkt / SP.at_net_gain));
  }, 0);
  const evenSh = w.reduce((a, x, i) => a + (S.is_even[i] ? x : 0), 0);
  document.getElementById('kpi2').innerHTML = [
    ['この配分の平均出玉率', (mAvg * 100).toFixed(2) + '%'],
    ['偶数計', (evenSh * 100).toFixed(1) + '%'],
    ['設定4以上', ((w[3] + w[4] + w[5]) * 100).toFixed(1) + '%'],
    ['台間ばらつき CV_λ', cvHat != null ? (cvHat * 100).toFixed(1) + '%' : '—'],
  ].map(([k, v]) => `<div><span class="v">${v}</span><span class="k">${k}</span></div>`).join('');
  document.getElementById('note2').innerHTML =
    `市場全体の推定配分を事前分布に、この店の初当り${cvHat != null ? 'と台間ばらつき' : ''}に合うよう`
    + `最大エントロピーで傾けた分布です。${cvNote ? '<b>' + cvNote + '</b>' : ''}`
    + ' 個別設定の分離力は弱いので、<b>設定1と2の比率</b>や<b>設定4以上の合計</b>で読んでください。';

  /* --- 4. 期待値表 --- */
  // 0〜37G は引き戻しゾーンで値が急変するので細かく刻む
  const bins = [37];
  for (let g = 50; g <= 1450; g += 50) bins.push(g);
  let t = '<thead><tr><th>着席G</th><th>初当り確率</th><th>RUSH_TY</th>'
        + '<th>期待値</th><th>出玉率</th></tr></thead><tbody>';
  for (const g of bins) {
    const r = evalSeat(cur, w, g);
    if (!r) continue;
    const cls = r.ev >= 0 ? 'plus' : 'minus';
    t += `<tr><td class="lab">${g}</td>`
      + `<td>1/${r.add.toFixed(0)}</td><td>${r.ty.toFixed(0)}</td>`
      + `<td class="${cls}">${r.ev >= 0 ? '+' : ''}${Math.round(r.ev * yen).toLocaleString()}</td>`
      + `<td class="${cls}">${(r.roi * 100).toFixed(1)}%</td></tr>`;
  }
  t += '</tbody>';
  document.getElementById('tEV').innerHTML = t;

  document.getElementById('note3').innerHTML =
    `着席G = 台が表示する<b>前回信号からのG</b>。「<b>当選するまで打ち、当たったらRUSHを完走してヤメ</b>」`
    + `が前提です(予算無限)。初当り確率=そのG以降の平均的な当たりやすさ(1Gあたり)。`
    + `RUSH_TY=当選から塊の終わりまでの出玉(枚)。期待値=円(1枚20円換算)。`
    + `ヤメ判断補正 ${SP.yame_hosei_g}G と MAX BET 補正 ${SP.max_bet_corr}枚/回 を織り込み済み。`
    + `着席が深いほど低設定の可能性が上がる効果も反映しています。`
    + `37G以内のゾーン狙い(32G→37Gまで回してヤメ 等)は下の窓評価を使ってください。`;

  document.getElementById('method').innerHTML = `
    <b>① 初当り確率 → 設定配分</b><br>
    市場全体(${D.meta.sessions.toLocaleString()}セッション)の推定配分
    ${D.prior.map((p, i) => S.labels[i] + ' ' + (p * 100).toFixed(1) + '%').join(' / ')}
    を事前分布に置き、この店の初当り確率に一致するよう指数傾斜(最大エントロピー)で更新します。
    台ごとの行が8台以上あるときは、台間のばらつき CV_λ も制約に加えます。
    設定内の揺らぎ CV²=${MK.cv2_within}(天井1480Gで裾が切れるためポアソン=1ではない)を基準線として、
    観測分散から設定由来の分散だけを取り出しています。<br><br>
    <b>② 設定別の期待値</b><br>
    設定別のハザード曲線は実データから分離できないため、
    <b>形は共通・高さだけ λ_s に比例</b>(天井付近は1で頭打ち)としてスケールしています。
    TY は公表の設定別 λt に TY不足 ${(shortfall * 100).toFixed(1)}% を掛けて設定別に配分。<br><br>
    <b>③ 混合</b><br>
    着席G=X 時点の設定事後確率 P(s|X) ∝ v_s・S_s(X) で重み付け、
    期待差枚と期待投入をそれぞれ足し上げて ROI = 1 + E[差枚]/E[投入] としています。
    ROI の単純平均ではありません。<br><br>
    <b>限界</b><br>
    ・設定別の市場出玉率は実データから推定できず、TY不足を全設定一律で配った仮定値です。<br>
    ・1台あたり初当り15回程度では設定1と設定3は区別できません。個別設定でなく群で読んでください。<br>
    ・市場配分の事前分布は解析期間(${D.meta.period[0]}〜${D.meta.period[1]})のものです。`;

  LAST = { cur, w, yen };
  renderWindow();
  document.getElementById('out').classList.remove('hide');
  document.getElementById('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 窓評価の描画 ---------- */
let LAST = null;
document.getElementById('wRun').onclick = renderWindow;

function renderWindow() {
  if (!LAST) return;
  const { cur, w, yen } = LAST;
  const Xg = Math.max(0, Math.round(+document.getElementById('wX').value || 0));
  const end = Math.min(GMAX, Math.round(+document.getElementById('wEnd').value || 0));
  if (end <= Xg) {
    document.getElementById('noteW').textContent = '終了Gは着席Gより大きくしてください。';
    return;
  }
  const main = evalWindow(cur, w, Xg, end - Xg);
  document.getElementById('kpiW').innerHTML = [
    ['窓内 当選率', (main.pWin * 100).toFixed(2) + '%'],
    ['実際に回す通常G', main.eN.toFixed(2) + ' G'],
    ['当選時の平均獲得', main.gain.toFixed(0) + ' 枚'],
    ['期待値', (main.net >= 0 ? '+' : '') + main.net.toFixed(1) + ' 枚('
      + (main.net >= 0 ? '+' : '') + Math.round(main.net * yen).toLocaleString() + '円)'],
  ].map(([k, v]) => `<div><span class="v">${v}</span><span class="k">${k}</span></div>`).join('');

  // 終了Gを X+1 から掃引(最大60行)
  const span = end - Xg;
  const step = span <= 60 ? 1 : Math.ceil(span / 60);
  let t = '<thead><tr><th>終了G</th><th>当選率</th><th>回す通常G</th><th>平均獲得<br>(枚)</th>'
        + '<th>期待値<br>(枚)</th><th>期待値(円)<br><span style="font-weight:normal">20円換算</span></th><th>出玉率<br>(ROI)</th></tr></thead><tbody>';
  for (let e = Xg + step; e <= end; e += step) {
    const r = evalWindow(cur, w, Xg, e - Xg);
    if (!r) continue;
    const cls = r.net >= 0 ? 'plus' : 'minus';
    const hl = e === end ? ' style="outline:2px solid var(--gold);outline-offset:-2px"' : '';
    t += `<tr${hl}><td class="lab">${e}</td><td>${(r.pWin * 100).toFixed(2)}%</td>`
      + `<td>${r.eN.toFixed(2)}</td><td>${r.gain.toFixed(0)}</td>`
      + `<td class="${cls}">${r.net >= 0 ? '+' : ''}${r.net.toFixed(1)}</td>`
      + `<td class="${cls}">${r.net >= 0 ? '+' : ''}${Math.round(r.net * yen).toLocaleString()}</td>`
      + `<td class="${cls}">${(r.roi * 100).toFixed(1)}%</td></tr>`;
  }
  t += '</tbody>';
  document.getElementById('tW').innerHTML = t;
  document.getElementById('noteW').innerHTML =
    `「着席${Xg}G → 各終了Gまで回して当選しなければヤメ」の評価(§7-11 拾い窓)。`
    + `当選したら RUSH を完走(そこから塊の終わりまでの出玉)。`
    + `平均獲得は窓内当選の実データ平均(MAXBET補正 ${SP.max_bet_corr}枚 は計算に織込み)。`
    + `ヤメ判断補正は使いません(窓そのものがヤメ挙動のため)。`
    + `設定は着席${Xg}G時点の事後確率で混合。`
    + `<b>37G以内の当選は連荘扱い(引き戻しゾーン)</b>なので、32→37 の窓はこのゾーンの拾いです。`;
}

parseRows();
</script>
